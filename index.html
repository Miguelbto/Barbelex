<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbelex</title>
    <link rel="stylesheet" href="./src//css/output.css">
</head>

<body>

    <header class="bg-[#2d3238] border-t-2 border-[#7e7ffc] w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <div class="flex items-center space-x-2 shrink-0">
                    <img src="/src/image/logo.png" alt="logo Barbelex" class="h-6 w-6 sm:h-7 sm:w-7" />
                    <span class="text-lg sm:text-2xl font-bold text-[#f7cd46] tracking-wide uppercase">
                        BARBELEX
                    </span>
                </div>

                <nav class="hidden md:flex items-center space-x-6 lg:space-x-8">
                    <a href="#"
                        class="text-xs lg:text-sm font-medium text-gray-300 uppercase tracking-widest hover:text-white transition-colors">Services</a>
                    <a href="#"
                        class="text-xs lg:text-sm font-medium text-gray-300 uppercase tracking-widest hover:text-white transition-colors">Contact</a>
                </nav>

                <div class="flex items-center space-x-3">
                    <a href="#"
                        class="bg-[#f7cd46] text-[#2d3238] px-3.5 py-1.5 sm:px-5 sm:py-2 rounded text-xs sm:text-sm font-bold uppercase tracking-wider hover:bg-yellow-400 transition-colors">
                        AGENDAR
                    </a>

                    <button id="menu-btn" aria-label="Menu"
                        class="md:hidden text-gray-300 hover:text-white p-1 focus:outline-none">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>

            </div>

            <div id="mobile-menu" class="hidden md:hidden pb-4 pt-2 border-t border-gray-700/50 space-y-2">
                <a href="#"
                    class="block text-xs font-medium text-gray-300 uppercase tracking-wider hover:text-white py-1">Services</a>

                <a href="#"
                    class="block text-xs font-medium text-gray-300 uppercase tracking-wider hover:text-white py-1">Contact</a>
            </div>
        </div>
    </header>

    <main>

        <section class="relative min-h-screen flex items-center justify-center pt-20 bg-neural-950 overflow-hidden">
            <!-- Imagem de Fundo com Overlay Escuro -->
            <div class="absolute inset-0 z-0">
                <img src="/src/image/image-principal.png" alt="Barbearia" class="w-full h-full object-cover opacity-60" />
                <div class="absolute inset-0 bg-gradient-to-b from-neutral-950/80 via-neutral-950/60 to-neutral-950">
                </div>
            </div>

            <!-- Conteúdo Centralizado -->
            <div class="relative z-10 max-w-4xl mx-auto px-4 text-center flex flex-col items-center space-y-6 py-16">

                <!-- Badge Avaliação -->
                <div
                    class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-neutral-900/90 border border-neutral-700/80 text-xs text-neutral-200 backdrop-blur-sm">
                    <span class="text-[#f7cd46]">★</span>
                    <span class="font-medium tracking-wide uppercase">4.9/5 NO GOOGLE — +1.200 CLIENTES</span>
                </div>

                <!-- Título Principal -->
                <h1
                    class="text-4xl sm:text-6xl md:text-7xl font-extrabold text-white uppercase tracking-tight leading-tight">
                    ESTILO E PRECISÃO <br class="hidden sm:inline" />
                    PARA A SUA MELHOR VERSÃO
                </h1>

                <!-- Subtítulo -->
                <p class="max-w-2xl text-sm sm:text-base text-neutral-300 font-normal leading-relaxed">
                    A excelência da barbearia clássica encontra o luxo contemporâneo.
                    Experimente o ápice do cuidado masculino no coração da cidade.
                </p>

                <!-- Botões de Ação -->
                <div class="flex flex-col sm:flex-row items-center gap-4 pt-4 w-full sm:w-auto">
                    <a href="#servicos"
                        class="w-full sm:w-auto px-8 py-3.5 bg-neutral-900/80 border border-neutral-700 text-[#f7cd46] font-bold rounded-md text-xs sm:text-sm tracking-wider uppercase hover:bg-neutral-800 transition text-center">
                        VER SERVIÇOS
                    </a>
                </div>

            </div>
        </section>

    </main>



    <script src="./src/script/script.js"></script>
</body>

</html>
