<!-- Botão Flutuante de Chat Fixado (Canto Inferior Direito) -->

>
  <svg class="w-6 h-6 transition-transform group-hover:rotate-12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
